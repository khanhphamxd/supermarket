spring.application.name=supermarket

# Tell Spring Boot where the database is
# localhost: where PostgreSQL is
# 5432: which port is PostgreSQL listening on (default PostgreSQL port)
# supermarket: database name
spring.datasource.url=jdbc:postgresql://localhost:5432/supermarket

# Username for the account that will connect to the database 
# (use the one created during the db setup)
spring.datasource.username=postgres

# Password of your database
spring.datasource.password=${DB_PASSWORD}

# Hibernate: the thing (yes "implementation" is the better word, but me brain smol) that
# proccess & handle the object(entity) - database mapping
# This line call for Hibernate to adjust the database tables based on the Entity class adjustment
# when needed (e.g., when an attribute or method is added/deleted)
spring.jpa.hibernate.ddl-auto=update

# Show the SQL statements generated by JPA/Hibernate in the console
spring.jpa.show-sql=true